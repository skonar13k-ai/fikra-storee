<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:">
<title>FIKRA</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f5f1;--card:#fff;--text:#14161b;--muted:#6b7280;--acc:#14161b;--brand:#c2410c;--soft:#efede6;--line:#e4e1d9;--onacc:#fff;color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0e1014;--card:#16191f;--text:#f3f4f6;--muted:#9ca3af;--acc:#f3f4f6;--brand:#fb923c;--soft:#1e222a;--line:#2a2f38;--onacc:#111827;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1014;--card:#16191f;--text:#f3f4f6;--muted:#9ca3af;--acc:#f3f4f6;--brand:#fb923c;--soft:#1e222a;--line:#2a2f38;--onacc:#111827;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--card);border-bottom:1px solid var(--line)}
.bar{max-width:1120px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:12px 20px;gap:10px;flex-wrap:wrap}
.logo{font-weight:800;letter-spacing:.2em;font-size:19px;cursor:pointer;text-transform:uppercase}
.nav{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
button{font:inherit;font-size:14px;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);padding:8px 14px;font-weight:500}
button:hover{border-color:var(--muted)}
button.p{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
button.g{border-color:transparent;background:transparent}
button.d{color:#dc2626}
.badge{background:var(--brand);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px;margin-left:6px}
.hero{background:linear-gradient(135deg,var(--soft),var(--bg));border-bottom:1px solid var(--line);text-align:center;padding:64px 20px}
.hero h1{font-size:clamp(32px,7vw,56px);margin:0 0 10px;letter-spacing:-.02em}
.hero p{color:var(--muted);margin:0 auto;max-width:480px}
.sec{max-width:1120px;margin:auto;padding:32px 20px}
.sec h2{margin:0 0 16px;font-size:22px}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.tools input,.tools select{max-width:260px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(0,0,0,.08)}
.img{font-size:64px;text-align:center;background:var(--soft);height:170px;display:grid;place-items:center;overflow:hidden}
.img img{width:100%;height:100%;object-fit:cover}
.body{padding:16px;display:flex;flex-direction:column;gap:6px;flex:1}
.body h3{margin:0;font-size:16px}
.body p{margin:0;color:var(--muted);font-size:14px;flex:1}
.tag{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--brand);font-weight:600}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.price{font-weight:700;font-size:18px}
.empty{text-align:center;padding:60px 20px;color:var(--muted);border:1px dashed var(--line);border-radius:16px}
.auth{min-height:70vh;display:grid;place-items:center;padding:20px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;width:100%}
.auth .panel{max-width:400px}
.panel h2,.panel h3{margin:0 0 4px}
.sub{color:var(--muted);font-size:14px;margin:0 0 8px}
label{display:block;font-size:13px;font-weight:500;margin:12px 0 5px}
input,textarea,select{width:100%;font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
input:focus,textarea:focus,select:focus{outline:2px solid var(--brand);outline-offset:-1px}
.err{color:#dc2626;font-size:14px;min-height:20px;margin-top:8px}
.ok{color:#16a34a}
.full{width:100%;margin-top:6px;padding:12px}
.tabs{display:flex;gap:4px;margin-bottom:20px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;border-radius:0;background:none;border-bottom:2px solid transparent;color:var(--muted)}
.tabs button.on{color:var(--text);border-color:var(--brand)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:20px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.stat b{display:block;font-size:26px}.stat span{color:var(--muted);font-size:13px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:20px;align-items:start}
@media(max-width:800px){.two{grid-template-columns:1fr}}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--muted);font-weight:500;padding:8px;border-bottom:1px solid var(--line)}
td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td .t{width:38px;height:38px;border-radius:8px;background:var(--soft);display:grid;place-items:center;overflow:hidden;font-size:22px}
td .t img{width:100%;height:100%;object-fit:cover}
.chk{display:flex;gap:8px;align-items:center;font-weight:400;margin:6px 0}
.chk input{width:auto}
.pill{font-size:12px;background:var(--soft);border-radius:99px;padding:2px 10px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;justify-content:flex-end}
.drawer{background:var(--card);width:min(380px,100%);height:100%;padding:20px;padding-top:calc(20px + env(safe-area-inset-top,0px));overflow-y:auto}
.ci{display:flex;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.ci .n{flex:1;font-size:14px}
.ci .t{width:44px;height:44px;border-radius:8px;background:var(--soft);display:grid;place-items:center;overflow:hidden;font-size:26px}
.ci .t img{width:100%;height:100%;object-fit:cover}
footer{text-align:center;color:var(--muted);font-size:13px;padding:28px 20px;border-top:1px solid var(--line)}
:root:root:root{--bg:#07040d;--card:#120a1f;--text:#f5f0ff;--muted:#a79bbd;--acc:#a855f7;--brand:#c084fc;--soft:#1b1030;--line:#2e1f4a;--onacc:#fff;color-scheme:dark}
.logo{display:flex;align-items:center;gap:10px}.lg{width:38px;height:38px;border-radius:50%}
.big{width:150px;height:150px;border-radius:50%;display:block;margin:0 auto 14px;box-shadow:0 0 40px rgba(168,85,247,.45)}
.auth .big{width:96px;height:96px}
</style>
</head>

x.items=(x.items||[]).map(function(i){return{id:+i.id||0,name:String(i.name||""),price:+i.price||0,stock:(i.stock===""||i.stock==null)?"":(+i.stock||0),cat:String(i.cat||""),emoji:String(i.emoji||""),desc:String(i.desc||""),img:/^data:image\/jpeg;base64,[A-Za-z0-9+\/=]+$/.test(i.img||"")?i.img:""}});
x.users=(x.users||[]).filter(function(u){return u.hash&&u.salt}).map(function(u){var p={};for(var k in PERMS)if(u.perms&&u.perms[k])p[k]=1;return{id:+u.id||0,user:String(u.user),salt:String(u.salt),hash:String(u.hash),role:u.role==="owner"?"owner":"staff",perms:p}});return x}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert("Storage is full. Use a smaller image or delete some products.")}}
var db=load(),cart={},view="shop",tab="ov",q="",cat="",ed=null,eu=null,tmpImg="",cur=null;
try{var sid=sessionStorage.getItem(SKEY);cur=db.users.find(function(u){return u.id==sid})||null}catch(e){}
if(cur){view="dash";touch()}
function can(p){return cur&&(cur.role==="owner"||(cur.perms&&cur.perms[p]))}
function isOwner(){return cur&&cur.role==="owner"}
function money(n){return n+" "+db.set.cur}
function find(id){return db.items.find(function(x){return x.id==id})}
function cnt(){var n=0;for(var k in cart)n+=cart[k];return n}
function pic(i){return i.img?'<img src="'+i.img+'" alt="">':esc(i.emoji||"🛍️")}
function go(v,t){view=v;if(t)tab=t;render()}
function nav(){
 $("logo").innerHTML='<img src="'+LOGO+'" class="lg" alt=""><span>'+esc(db.set.name)+'</span>';document.title=db.set.name;
 var h='<button class="g" onclick="go(\'shop\')">Shop</button>';
 if(cur)h+='<button class="g" onclick="go(\'dash\')">Dashboard</button><button onclick="logout()">Log out ('+esc(cur.user)+')</button>';
 else h+='<button onclick="go(\'login\')">Login</button>';
 $("nav").innerHTML=h+'<button class="p" onclick="openCart()">Cart<span class="badge">'+cnt()+'</span></button>';
}
function render(){
 if(view==="dash"&&!cur)view="login";
 nav();window.scrollTo(0,0);
 if(view==="shop")shop();else if(view==="login")login();else dash();
}
function shop(){
 var cats=[];db.items.forEach(function(i){if(i.cat&&cats.indexOf(i.cat)<0)cats.push(i.cat)});
 var list=db.items.filter(function(i){return(!cat||i.cat===cat)&&(!q||i.name.toLowerCase().indexOf(q.toLowerCase())>=0)});
 $("app").innerHTML='<section class="hero"><img src="'+LOGO+'" class="big" alt=""><h1>'+esc(db.set.title)+'</h1><p>'+esc(db.set.tag)+'</p></section><section class="sec"><h2>Products</h2>'+
 (db.items.length?'<div class="tools"><input id="sq" placeholder="Search products" value="'+esc(q)+'" oninput="q=this.value;list2()">'+(cats.length?'<select onchange="cat=this.value;render()"><option value="">All categories</option>'+cats.map(function(c){return '<option'+(c===cat?' selected':'')+'>'+esc(c)+'</option>'}).join("")+'</select>':'')+'</div>':'')+
 '<div id="pl"></div></section><footer>© 2026 '+esc(db.set.name)+'. All rights reserved.</footer>';
 list2();
}
function list2(){
 var list=db.items.filter(function(i){return(!cat||i.cat===cat)&&(!q||i.name.toLowerCase().indexOf(q.toLowerCase())>=0)});
 $("pl").innerHTML=list.length?'<div class="grid">'+list.map(function(i){var out=i.stock!==""&&i.stock!=null&&i.stock<=0;
  return '<div class="card"><div class="img">'+pic(i)+'</div><div class="body">'+(i.cat?'<span class="tag">'+esc(i.cat)+'</span>':'')+'<h3>'+esc(i.name)+'</h3><p>'+esc(i.desc)+'</p><div class="foot"><span class="price">'+money(i.price)+'</span>'+(out?'<span class="pill">Sold out</span>':'<button class="p" onclick="add('+i.id+')">Add to cart</button>')+'</div></div></div>'}).join("")+'</div>':
  '<div class="empty">'+(db.items.length?'No products match your search.':'No products yet. Check back soon.')+'</div>';
}
function login(){var f=!db.users.length;
$("app").innerHTML='<div class="auth"><div class="panel"><img src="'+LOGO+'" class="big" alt=""><h2>'+(f?'Create owner account':'Login')+'</h2><p class="sub">'+(f?'First-time setup: choose your owner username and a strong password (10+ characters).':'Sign in to manage the store.')+'</p><label>Username</label><input id="u" maxlength="40" autocomplete="username"><label>Password</label><input id="p" type="password" autocomplete="'+(f?'new-password':'current-password')+'" onkeydown="if(event.key===\'Enter\')doLogin()"><div id="e" class="err"></div><button class="p full" onclick="doLogin()">'+(f?'Create account':'Sign in')+'</button></div></div>';}
async function hashPw(p,salt){var k=await crypto.subtle.importKey("raw",new TextEncoder().encode(p),"PBKDF2",false,["deriveBits"]);return hex(await crypto.subtle.deriveBits({name:"PBKDF2",salt:unhex(salt),iterations:150000,hash:"SHA-256"},k,256))}
function hex(b){return Array.from(new Uint8Array(b)).map(function(x){return("0"+x.toString(16)).slice(-2)}).join("")}
function unhex(h){return new Uint8Array(h.match(/../g).map(function(x){return parseInt(x,16)}))}
function newSalt(){return hex(crypto.getRandomValues(new Uint8Array(16)))}
function same(a,b){if(a.length!==b.length)return false;var r=0;for(var i=0;i<a.length;i++)r|=a.charCodeAt(i)^b.charCodeAt(i);return r===0}
var fails=0;try{fails=+localStorage.getItem("fikra_fails")||0}catch(e){}
function setFails(n){fails=n;try{localStorage.setItem("fikra_fails",n)}catch(e){}}
function lockLeft(){var t=0;try{t=+localStorage.getItem("fikra_lock")||0}catch(e){}return Math.ceil((t-Date.now())/1000)}
async function doLogin(){
 var n=V("u").trim(),p=V("p"),L=lockLeft();
 if(L>0){$("e").textContent="Too many attempts. Try again in "+L+"s.";return}
 if(!db.users.length){
  if(n.length<3||p.length<10){$("e").textContent="Username 3+ characters and password 10+ characters required.";return}
  var s=newSalt(),o={id:Date.now(),user:n,salt:s,hash:await hashPw(p,s),role:"owner",perms:{}};db.users.push(o);save();startSession(o);return}
 var u=db.users.find(function(x){return x.user===n}),h=await hashPw(p,u?u.salt:newSalt());
 if(!(u&&same(h,u.hash))){setFails(fails+1);if(fails>=5){try{localStorage.setItem("fikra_lock",Date.now()+30000*Math.pow(2,Math.min(fails-5,6)))}catch(e){}}$("e").textContent="Incorrect username or password.";return}
 setFails(0);startSession(u);
}
function startSession(u){cur=u;try{sessionStorage.setItem(SKEY,u.id)}catch(e){}touch();go("dash","ov")}
var idle;function touch(){clearTimeout(idle);if(cur)idle=setTimeout(function(){alert("Logged out due to inactivity.");logout()},900000)}
["click","keydown"].forEach(function(e){document.addEventListener(e,touch)});
function logout(){cur=null;try{sessionStorage.removeItem(SKEY)}catch(e){}go("shop")}
function dash(){
 var tabs=[["ov","Overview"],["pr","Products"]];
 if(can("settings"))tabs.push(["st","Store settings"]);
 if(isOwner())tabs.push(["ac","Accounts"]);
 if(!tabs.some(function(t){return t[0]===tab}))tab="ov";
 var h='<div class="sec"><h2>Dashboard</h2><div class="tabs">'+tabs.map(function(t){return '<button class="'+(tab===t[0]?'on':'')+'" onclick="tab=\''+t[0]+'\';ed=null;eu=null;tmpImg=\'\';render()">'+t[1]+'</button>'}).join("")+'</div>';
 if(tab==="ov"){
  var tot=db.items.reduce(function(s,i){return s+Number(i.price)},0),low=db.items.filter(function(i){return i.stock!==""&&i.stock!=null&&i.stock<=3}).length;
  h+='<div class="stats"><div class="stat"><b>'+db.items.length+'</b><span>Products</span></div><div class="stat"><b>'+money(db.items.length?Math.round(tot/db.items.length*10)/10:0)+'</b><span>Average price</span></div><div class="stat"><b>'+low+'</b><span>Low or no stock</span></div><div class="stat"><b>'+db.users.length+'</b><span>Accounts</span></div></div>'+
  '<div class="panel"><h3>Signed in as '+esc(cur.user)+' <span class="pill">'+esc(cur.role)+'</span></h3><p class="sub">Your permissions: '+(isOwner()?'full access':(Object.keys(PERMS).filter(can).map(function(k){return PERMS[k]}).join(", ")||'view only'))+'</p></div>';
 }
 if(tab==="pr")h+=products();
 if(tab==="st")h+=settings();
 if(tab==="ac")h+=accounts();
 $("app").innerHTML=h+'</div>';
}
function products(){
 var e=ed?find(ed):null,showForm=e?can("edit"):can("add"),h='<div class="two">';
 if(showForm){var im=tmpImg||(e&&e.img)||"";
  h+='<div class="panel"><h3>'+(e?'Edit product':'Add product')+'</h3><label>Name</label><input id="n" value="'+esc(e&&e.name)+'"><label>Price ('+esc(db.set.cur)+')</label><input id="pr" type="number" min="0" step="0.5" value="'+esc(e&&e.price)+'"><label>Stock (leave empty for unlimited)</label><input id="sk" type="number" min="0" value="'+esc(e&&e.stock)+'"><label>Category</label><input id="ct" value="'+esc(e&&e.cat)+'"><label>Photo</label><input type="file" accept="image/*" onchange="upl(this)"><div id="pv">'+(im?'<div class="img" style="height:110px;margin-top:8px;border-radius:10px"><img src="'+im+'" alt=""></div>':'')+'</div><label>Emoji (used if no photo)</label><input id="em" value="'+esc(e&&e.emoji)+'"><label>Description</label><textarea id="d" rows="2">'+esc(e&&e.desc)+'</textarea><div id="e" class="err"></div><button class="p full" onclick="saveItem()">'+(e?'Save changes':'Add product')+'</button>'+(e?'<button class="full" onclick="ed=null;tmpImg=\'\';render()">Cancel</button>':'')+'</div>';
 } else h+='<div class="panel"><h3>View only</h3><p class="sub">Your account cannot add or edit products.</p></div>';
 h+='<div class="panel"><h3>Products ('+db.items.length+')</h3>'+(db.items.length?'<div class="tw"><table><tr><th></th><th>Name</th><th>Price</th><th>Stock</th><th></th></tr>'+db.items.map(function(i){return '<tr><td><div class="t">'+pic(i)+'</div></td><td>'+esc(i.name)+'</td><td>'+money(i.price)+'</td><td>'+(i.stock===""||i.stock==null?'∞':i.stock)+'</td><td style="white-space:nowrap">'+(can("edit")?'<button onclick="ed='+i.id+';tmpImg=\'\';render()">Edit</button> ':'')+(can("del")?'<button class="d" onclick="delItem('+i.id+')">Delete</button>':'')+'</td></tr>'}).join("")+'</table></div>':'<div class="empty" style="margin-top:12px">No products yet.</div>')+'</div></div>';
 return h;
}
function upl(inp){
 var f=inp.files[0];if(!f)return;var r=new FileReader();
 r.onload=function(){var im=new Image();im.onload=function(){var s=Math.min(1,500/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);tmpImg=c.toDataURL("image/jpeg",.8);$("pv").innerHTML='<div class="img" style="height:110px;margin-top:8px;border-radius:10px"><img src="'+tmpImg+'" alt=""></div>'};im.src=r.result};r.readAsDataURL(f);
}
var draft={};
function keep(){["n","pr","sk","ct","em","d"].forEach(function(k){if($(k))draft[k]=V(k)})}
function saveItem(){if(!(ed?can("edit"):can("add")))return;
 var n=V("n").trim(),p=parseFloat(V("pr"));
 if(!n||isNaN(p)||p<0){$("e").textContent="Enter a name and a valid price.";return}
 var e=ed?find(ed):null,o={name:n,price:p,stock:V("sk")===""?"":parseInt(V("sk")),cat:V("ct").trim(),emoji:V("em").trim(),desc:V("d").trim(),img:tmpImg||(e&&e.img)||""};
 if(e)Object.assign(e,o);else{o.id=Date.now();db.items.push(o)}
 save();ed=null;tmpImg="";render();
}
function delItem(id){if(!can("del")||!confirm("Delete this product?"))return;db.items=db.items.filter(function(i){return i.id!==id});delete cart[id];save();render()}
function settings(){
 var s=db.set;return '<div class="panel" style="max-width:520px"><h3>Store settings</h3><label>Store name</label><input id="sn" value="'+esc(s.name)+'"><label>Homepage title</label><input id="stt" value="'+esc(s.title)+'"><label>Tagline</label><textarea id="stg" rows="2">'+esc(s.tag)+'</textarea><label>Currency</label><input id="sc" value="'+esc(s.cur)+'"><div id="e" class="err"></div><button class="p full" onclick="saveSet()">Save settings</button></div>';
}
function saveSet(){if(!can("settings"))return;
 if(!V("sn").trim()){$("e").textContent="Store name is required.";return}
 db.set={name:V("sn").trim(),title:V("stt").trim(),tag:V("stg").trim(),cur:V("sc").trim()||"TND"};save();nav();$("e").className="err ok";$("e").textContent="Saved.";
}
function accounts(){
 var u=eu?db.users.find(function(x){return x.id==eu}):null,own=u&&u.role==="owner",pm=(u&&u.perms)||{};
 var h='<div class="two"><div class="panel"><h3>'+(u?'Edit account':'Create account')+'</h3><label>Username</label><input id="au" value="'+esc(u&&u.user)+'" autocomplete="off"><label>Password'+(u?' (leave empty to keep)':'')+'</label><input id="ap" type="password" autocomplete="off">';
 if(!own){h+='<label>Role</label><select id="ar" onchange="preset(this.value)"><option value="custom">Custom</option><option value="manager">Manager</option><option value="editor">Editor</option><option value="viewer">Viewer</option></select><label>Permissions</label>'+Object.keys(PERMS).map(function(k){return '<label class="chk"><input type="checkbox" id="pm_'+k+'"'+(pm[k]?' checked':'')+'>'+PERMS[k]+'</label>'}).join("")}
 else h+='<p class="sub">The owner always has full access.</p>';
 h+='<div id="e" class="err"></div><button class="p full" onclick="saveUser()">'+(u?'Save account':'Create account')+'</button>'+(u?'<button class="full" onclick="eu=null;render()">Cancel</button>':'')+'</div>'+
 '<div class="panel"><h3>Accounts ('+db.users.length+')</h3><div class="tw"><table><tr><th>User</th><th>Access</th><th></th></tr>'+db.users.map(function(x){
  return '<tr><td>'+esc(x.user)+'</td><td>'+(x.role==="owner"?'<span class="pill">Owner</span>':Object.keys(PERMS).filter(function(k){return x.perms&&x.perms[k]}).map(function(k){return '<span class="pill">'+k+'</span>'}).join(" ")||'<span class="pill">view only</span>')+'</td><td style="white-space:nowrap"><button onclick="eu='+x.id+';render()">Edit</button> '+(x.role==="owner"?'':'<button class="d" onclick="delUser('+x.id+')">Delete</button>')+'</td></tr>'}).join("")+'</table></div></div></div>';
 return h;
}
function preset(r){var p=PRESETS[r];if(!p)return;Object.keys(PERMS).forEach(function(k){$("pm_"+k).checked=!!p[k]})}
async function saveUser(){if(!isOwner())return;
 var n=V("au").trim(),p=V("ap"),u=eu?db.users.find(function(x){return x.id==eu}):null;
 if(!n){$("e").textContent="Username is required.";return}
 if(db.users.some(function(x){return x.user===n&&(!u||x.id!==u.id)})){$("e").textContent="That username is taken.";return}
 if(!u&&p.length<10){$("e").textContent="Password needs at least 10 characters.";return}
 if(u&&p&&p.length<10){$("e").textContent="Password needs at least 10 characters.";return}
 var pm={};if($("pm_add"))Object.keys(PERMS).forEach(function(k){if($("pm_"+k).checked)pm[k]=1});
 if(u){u.user=n;if(p){u.salt=newSalt();u.hash=await hashPw(p,u.salt)}if(u.role!=="owner")u.perms=pm}
 else{var sl=newSalt();db.users.push({id:Date.now(),user:n,salt:sl,hash:await hashPw(p,sl),role:"staff",perms:pm})}
 save();eu=null;render();
}
function delUser(id){var t=db.users.find(function(x){return x.id===id});if(!isOwner()||!t||t.role==="owner"||!confirm("Delete this account?"))return;db.users=db.users.filter(function(x){return x.id!==id});save();render()}
function add(id){var i=find(id),c=cart[id]||0;if(i.stock!==""&&i.stock!=null&&c>=i.stock)return alert("No more stock available.");cart[id]=c+1;nav()}
function qty(id,d){var i=find(id);if(d>0&&i.stock!==""&&i.stock!=null&&cart[id]>=i.stock)return;cart[id]=(cart[id]||0)+d;if(cart[id]<=0)delete cart[id];nav();openCart()}
function closeCart(){$("cartbox").innerHTML=""}
function openCart(){
 var t=0,rows="";
 for(var k in cart){var i=find(k);if(!i)continue;t+=i.price*cart[k];
  rows+='<div class="ci"><div class="t">'+pic(i)+'</div><span class="n">'+esc(i.name)+'<br><b>'+money(i.price)+'</b></span><span><button onclick="qty('+k+',-1)">−</button> '+cart[k]+' <button onclick="qty('+k+',1)">+</button></span></div>'}
 $("cartbox").innerHTML='<div class="ov" onclick="if(event.target===this)closeCart()"><div class="drawer"><div style="display:flex;justify-content:space-between;align-items:center"><h3 style="margin:0">Your cart</h3><button class="g" onclick="closeCart()">✕</button></div>'+(rows||'<p class="sub" style="margin-top:20px">Your cart is empty.</p>')+(rows?'<div style="display:flex;justify-content:space-between;margin:18px 0;font-size:18px"><b>Total</b><b>'+money(Math.round(t*100)/100)+'</b></div><button class="p full" onclick="closeCart();alert(\'Checkout is coming soon.\')">Checkout</button>':'')+'</div></div>';
}
render();
</script>
</body>
